<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration Form</title>
  <link href="style.css" rel="stylesheet">
</head>

<body>

<!-- ===== HEADER / BANNER ===== -->
<div id="banner">
  <img src="logo.png" alt="Company Logo" id="logo">
  <div id="banner-text">
    <h1>CarePoint Medical</h1>
    <p id="dynamic-date"></p>
  </div>
</div>

<!-- JavaScript to display dynamic day and date in the banner -->
<script>
  var days   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var months = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
  var now    = new Date();
  var suffix = (now.getDate() === 1 || now.getDate() === 21 || now.getDate() === 31) ? "st"
             : (now.getDate() === 2 || now.getDate() === 22)                         ? "nd"
             : (now.getDate() === 3 || now.getDate() === 23)                         ? "rd" : "th";
  document.getElementById("dynamic-date").innerHTML =
    "Today is: " + days[now.getDay()] + ", " +
    months[now.getMonth()] + " " + now.getDate() + suffix + ", " + now.getFullYear();
</script>

<!-- ===== MAIN CONTENT ===== -->
<div id="main">

  <h2>Patient Registration Form</h2>

  <form action="thankyou.html">

    <!-- ===== PERSONAL INFORMATION ===== -->
    <div class="section">
      <h3>Personal Information</h3>
      <table>

        <!-- First Name, MI, Last Name -->
        <tr>
          <td><label for="fname">First Name*</label></td>
          <td><input type="text" id="fname" name="fname" maxlength="30" required></td>

          <td><label for="mi">MI</label></td>
          <td><input type="text" id="mi" name="mi" maxlength="1" size="3"></td>

          <td><label for="lname">Last Name*</label></td>
          <td><input type="text" id="lname" name="lname" maxlength="30" required></td>

          <td><label for="dob">Date of Birth*</label></td>
          <td><input type="text" id="dob" name="dob" placeholder="MM/DD/YYYY"
               pattern="\d{2}/\d{2}/\d{4}" maxlength="10" required></td>
        </tr>

        <!-- SSN and Gender -->
        <tr>
          <td><label for="ssn">Social Security Number</label></td>
          <td><input type="password" id="ssn" name="ssn" maxlength="11"
               placeholder="XXX-XX-XXXX"></td>

          <td><label>Gender</label></td>
          <td colspan="5">
            <input type="radio" name="gender" value="male" id="male">
            <label for="male">Male</label>
            &nbsp;
            <input type="radio" name="gender" value="female" id="female">
            <label for="female">Female</label>
            &nbsp;
            <input type="radio" name="gender" value="other" id="other">
            <label for="other">Other</label>
          </td>
        </tr>

      </table>
    </div><!-- end Personal Information -->
